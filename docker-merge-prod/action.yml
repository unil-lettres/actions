name: Merge images service for production
description: Download digests, compute tag, merge multi-arch, expose tag output
inputs:
  image_repository:
    description: Docker Hub repository (e.g. org/name)
    required: true
  dockerhub_username:
    description: Docker Hub username
    required: true
  dockerhub_token:
    description: Docker Hub token
    required: true
  service:
    description: Service name, will be used as tag prefix (e.g. app, worker)
    required: false
    default: ''
  tag:
    description: Specific tag to use (optional, overrides auto-detected latest tag)
    required: false
    default: ''
  repository_path:
    description: Path to the Git repository used to determine the source revision
    required: false
    default: '.'
outputs:
  tag:
    description: Published tag
    value: ${{ steps.set-tag.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: digests-${{ inputs.service != '' && format('{0}-', inputs.service) || '' }}*
        merge-multiple: true

    - name: Set source revision
      id: source
      shell: bash
      # Read the revision before find-tags changes the configured repository
      run: |
        repository_path='${{ inputs.repository_path }}'
        if revision=$(git -C "$repository_path" rev-parse HEAD 2>/dev/null); then
          :
        else
          revision="$GITHUB_SHA"
          ref_name="${GITHUB_REF_NAME:-$GITHUB_REF}"
          echo "::warning::Git repository not found at '$repository_path'; using GITHUB_SHA=$revision from ref '$ref_name'"
        fi
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Get latest tag
      id: get_tags
      uses: unil-lettres/actions/find-tags@main

    - name: Compute additional tag
      id: compute
      shell: bash
      run: |
        # Determine the base tag
        LATEST='${{ inputs.tag || steps.get_tags.outputs.latest_tag }}'

        # Determine the tag prefix based on service input
        PREFIX='${{ inputs.service && format('{0}-', inputs.service) || '' }}'

        # Compute the tag based on event type and ref
        if [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF}" =~ ^refs/tags/.*$ ]]; then
          # Tag push
          TAG="${PREFIX}${LATEST}"
        elif [[ "${GITHUB_EVENT_NAME}" == 'push' ]]; then
          # Branch push
          TAG="${PREFIX}latest"
        else
          # Scheduled
          FULL_SHA='${{ steps.source.outputs.revision }}'
          SHORT_SHA="${FULL_SHA:0:7}"
          TS=$(date -u +"%Y%m%d%H%M%S")
          TAG="${PREFIX}${LATEST}-${SHORT_SHA}-${TS}"
        fi

        echo "additional_tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Merge (push)
      if: github.event_name == 'push'
      uses: unil-lettres/actions/docker-merge@main
      with:
        image_repository: ${{ inputs.image_repository }}
        tag: ${{ steps.compute.outputs.additional_tag }}
        dockerhub_username: ${{ inputs.dockerhub_username }}
        dockerhub_token: ${{ inputs.dockerhub_token }}

    - name: Merge (schedule)
      if: github.event_name == 'schedule'
      uses: unil-lettres/actions/docker-merge@main
      with:
        image_repository: ${{ inputs.image_repository }}
        tag: ${{ inputs.service != '' && format('{0}-latest', inputs.service) || 'latest' }}
        additional_tag: ${{ steps.compute.outputs.additional_tag }}
        dockerhub_username: ${{ inputs.dockerhub_username }}
        dockerhub_token: ${{ inputs.dockerhub_token }}

    - name: Set output tag
      id: set-tag
      shell: bash
      run: echo "tag=${{ steps.compute.outputs.additional_tag }}" >> $GITHUB_OUTPUT
