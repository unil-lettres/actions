name: Docker Build and Upload Digest
description: Build a Docker image for a platform, push by digest, and upload the digest artifact
inputs:
  platform:
    description: Target platform (e.g., linux/amd64)
    required: true
  image_repository:
    description: Docker image repository (e.g., user/repo)
    required: true
  name_prefix:
    description: Prefix for the digest artifact name (e.g., app or worker)
    required: true
  dockerhub_username:
    description: Docker Hub username
    required: true
  dockerhub_token:
    description: Docker Hub access token/password
    required: true
  dockerfile:
    description: Path to the Dockerfile
    required: false
    default: "./Dockerfile"
  context:
    description: Context path for the Docker build
    required: false
    default: "./"
  target:
    description: Optional multi-stage target
    required: false
    default: ""
  build_args:
    description: Optional build arguments
    required: false
    default: ""
  repository_path:
    description: Path to the Git repository used to determine the source revision
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Prepare
      shell: bash
      run: |
        platform='${{ inputs.platform }}'
        echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

    - name: Set source revision
      id: source
      shell: bash
      # Read the revision from the configured repository, not the event SHA
      run: |
        repository_path='${{ inputs.repository_path }}'
        if revision=$(git -C "$repository_path" rev-parse HEAD 2>/dev/null); then
          :
        else
          revision="$GITHUB_SHA"
          ref_name="${GITHUB_REF_NAME:-$GITHUB_REF}"
          echo "::warning::Git repository not found at '$repository_path'; using GITHUB_SHA=$revision from ref '$ref_name'"
        fi
        echo "revision=$revision" >> "$GITHUB_OUTPUT"

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.image_repository }}
        labels: |
          org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub_username }}
        password: ${{ inputs.dockerhub_token }}

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build_args }}
        provenance: true
        sbom: true
        outputs: type=image,"name=${{ inputs.image_repository }}",push-by-digest=true,name-canonical=true,push=true

    - name: Export digest
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/digests"
        digest="${{ steps.build.outputs.digest }}"
        touch "$RUNNER_TEMP/digests/${digest#sha256:}"

    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ inputs.name_prefix }}-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests/*
        if-no-files-found: error
        retention-days: 1
